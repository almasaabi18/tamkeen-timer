<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت المعسكر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            height: 100vh;
            margin: 0;
            background: transparent;
            overflow: hidden;
            position: relative;
        }

        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            background: #000;
        }

        .video-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: -1;
            pointer-events: none;
        }

        .timer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px; 
            
            background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            padding: 15px 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,.3),
                        inset 0 1px 1px rgba(255,255,255,.35),
                        inset 0 -1px 0 rgba(255,255,255,.08);
            direction: rtl;
            z-index: 10;
        }

        .timer-container::before {
            content: "";
            position: absolute;
            left: 14px; right: 14px; top: 10px; height: 42%;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
            pointer-events: none;
        }
        
        .timer-container::after {
            content: "";
            position: absolute;
            left: 12%; right: 12%; bottom: -10px; height: 20px;
            background: #c48cff;
            filter: blur(24px);
            opacity: .45;
            z-index: -1;
        }

        .text-section {
            display: flex;
            align-items: center;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            font-size: 26px;
            font-weight: 700;
        }

        .text-section .divider {
            color: #d1badd;
            font-size: 28px;
            margin-right: 15px; 
            font-weight: 700;
            opacity: 0.9;
        }

        .countdown-section {
            display: flex;
            align-items: center;
            gap: 12px;
            direction: rtl; 
            position: relative;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 118px;
            height: 128px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(69,39,95,.65), rgba(49,24,69,.80)); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 0 10px rgba(167, 123, 186, 0.2);
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-3px);
        }

        .time-box i {
            font-size: 22px;
            margin-bottom: 8px;
            color: #d1badd;
        }

        .time-box .number {
            font-size: 40px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
            transition: 0.2s ease;
        }

        .number.update {
            transform: scale(1.08);
            text-shadow: 0 0 18px rgba(255,255,255,.6);
        }

        .time-box .label {
            font-size: 15px;
            font-weight: 600;
            color: #d1badd;
        }

        .countdown-section .sep {
            width: 2px;
            height: 72px;
            background: linear-gradient(transparent, rgba(255,255,255,.8), transparent);
            box-shadow: 0 0 12px #c88cff;
            align-self: center;
        }

        .countdown-section > .time-box:first-child {
            background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(240,233,246,.85));
            color: #512566;
            text-shadow: none;
        }
        .countdown-section > .time-box:first-child .label,
        .countdown-section > .time-box:first-child i {
            color: #6a3a88;
        }

        @media (max-width: 900px) {
            .timer-container {
                flex-direction: column;
                gap: 25px;
                padding: 25px;
                bottom: 20px;
                width: 95%;
            }
            .text-section .divider {
                display: none;
            }
            .countdown-section {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="Tamkin_Screen.webm" type="video/webm">
    </video>
    
    <div class="video-overlay"></div>

    <div class="timer-container">
        
        <div class="text-section">
            الوقت المتبقي على نهاية المعسكر
            <span class="divider">|</span>
        </div>

        <div class="countdown-section">
            <div class="time-box">
                <i class="far fa-calendar-check"></i>
                <div class="number" id="days">00</div>
                <div class="label">أيام</div>
            </div><div class="sep"></div>

            <div class="time-box">
                <i class="far fa-clock"></i>
                <div class="number" id="hours">00</div>
                <div class="label">ساعة</div>
            </div><div class="sep"></div>

            <div class="time-box">
                <i class="far fa-clock"></i>
                <div class="number" id="minutes">00</div>
                <div class="label">دقيقة</div>
            </div><div class="sep"></div>

            <div class="time-box">
                <i class="far fa-clock"></i>
                <div class="number" id="seconds">00</div>
                <div class="label">ثانية</div>
            </div>
        </div>

    </div>

    <script>
        const targetDate = new Date("2026-09-05T17:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            [['days', days], ['hours', hours], ['minutes', minutes], ['seconds', seconds]].forEach(([id, v]) => {
                const el = document.getElementById(id);
                const val = String(v).padStart(2, '0');
                if (el.innerText !== val) {
                    el.classList.add('update');
                    setTimeout(() => el.classList.remove('update'), 180);
                    el.innerText = val;
                }
            });
        }

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
